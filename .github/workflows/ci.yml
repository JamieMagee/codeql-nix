name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extractor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --release -- -D warnings

      - name: cargo build --release
        run: nix develop --command cargo build --release

      - name: cargo test
        run: nix develop --command cargo test --release

      - name: Verify extractor binary
        run: |
          ./target/release/codeql-extractor-nix --help
          ./target/release/codeql-extractor-nix generate --help

  qltest:
    name: Pack + qltest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: Assemble extractor pack
        run: nix develop --command ./scripts/create-extractor-pack.sh

      - name: codeql resolve extractor
        run: |
          nix develop --command codeql resolve extractor \
            --language=nix --search-path=./extractor-pack

      - name: Install QL pack dependencies
        run: |
          nix develop --command bash -c '
            cd ql/lib && codeql pack install &&
            cd ../src && codeql pack install &&
            cd ../test && codeql pack install
          '

      - name: codeql test run
        run: |
          nix develop --command codeql test run \
            --search-path=./extractor-pack \
            --additional-packs=ql \
            ql/test

      - name: Upload extractor pack as workflow artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-extractor-nix-linux64
          path: extractor-pack/
          retention-days: 14
