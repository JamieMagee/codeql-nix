name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extractor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --release -- -D warnings

      - name: cargo build --release
        run: nix develop --command cargo build --release

      - name: cargo test
        run: nix develop --command cargo test --release

      - name: Verify extractor binary
        run: |
          ./target/release/codeql-extractor-nix --help
          ./target/release/codeql-extractor-nix generate --help

  qltest:
    name: Pack + qltest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target

      - name: Assemble extractor pack
        run: nix develop --command ./scripts/create-extractor-pack.sh

      - name: codeql resolve extractor
        run: |
          nix develop --command codeql resolve extractor \
            --language=nix --search-path=./extractor-pack

      - name: Install QL pack dependencies
        run: |
          nix develop --command bash -c '
            cd ql/lib && codeql pack install &&
            cd ../src && codeql pack install &&
            cd ../test && codeql pack install
          '

      - name: codeql test run
        run: |
          nix develop --command codeql test run \
            --search-path=./extractor-pack \
            --additional-packs=ql \
            ql/test

      - name: Upload extractor pack as workflow artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-extractor-nix-linux64
          path: extractor-pack/
          retention-days: 14
