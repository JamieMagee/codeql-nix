name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extractor pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        # Pinned SHA — this is dtolnay/rust-toolchain's `stable` channel
        # branch, which resolves to the latest stable release at the time
        # of the SHA pin.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target

      - name: Build release binary
        run: cargo build --release

      - name: Assemble extractor pack
        # The dbscheme and TreeSitter.qll are committed to the repo, so
        # we can assemble the pack without re-running `extractor generate`
        # and without needing the CodeQL CLI on this runner.
        run: |
          set -euo pipefail
          mkdir -p extractor-pack/tools/linux64
          cp codeql-extractor.yml extractor-pack/
          cp ql/lib/nix.dbscheme extractor-pack/
          cp ql/lib/nix.dbscheme.stats extractor-pack/
          cp -r tools/* extractor-pack/tools/
          chmod +x extractor-pack/tools/*.sh
          cp target/release/codeql-extractor-nix extractor-pack/tools/linux64/extractor
          file extractor-pack/tools/linux64/extractor
          ldd extractor-pack/tools/linux64/extractor || true

      - name: Determine tag and asset name
        id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          asset="codeql-extractor-nix-${tag}-linux64.tar.gz"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Package extractor pack
        run: |
          tar -czf "${{ steps.meta.outputs.asset }}" extractor-pack/

      - name: Extract release notes for this tag from CHANGELOG.md
        id: notes
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          version="${tag#v}"
          awk -v ver="$version" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" ver "\\]") in_section = 1
              else next
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "## ${tag}" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "No matching CHANGELOG entry; see commit history." >> /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          asset="${{ steps.meta.outputs.asset }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" \
              "$asset" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
